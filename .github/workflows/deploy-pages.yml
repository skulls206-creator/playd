name: Deploy to GitHub Pages

on:
  push:
    branches: [ai-fixes, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build
        run: |
          cd artifacts/audio-player
          pnpm install
          BASE_PATH=/ pnpm run build
        env:
          PORT: "3000"


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/audio-player/dist/public
          force_orphan: true
