<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%"   stop-color="#18083e"/>
      <stop offset="55%"  stop-color="#0c0520"/>
      <stop offset="100%" stop-color="#060210"/>
    </radialGradient>
    <linearGradient id="hb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#efc8ff"/>
      <stop offset="22%"  stop-color="#d946ef"/>
      <stop offset="58%"  stop-color="#8b21e8"/>
      <stop offset="100%" stop-color="#6b1fc8"/>
    </linearGradient>
    <radialGradient id="lc" cx="32%" cy="26%" r="72%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#b87ef5"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4a1a95"/>
    </radialGradient>
    <radialGradient id="rc" cx="68%" cy="26%" r="72%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#b87ef5"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4a1a95"/>
    </radialGradient>
    <radialGradient id="ov" cx="40%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#6b28d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1c0d38"/>
    </radialGradient>
    <radialGradient id="cap" cx="50%" cy="25%" r="70%">
      <stop offset="0%"   stop-color="white"   stop-opacity="1"/>
      <stop offset="35%"  stop-color="#f0d0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="wide" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="mid" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shine" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect width="180" height="180" rx="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>

  <!-- Ambient purple glow -->
  <ellipse cx="90" cy="100" rx="85" ry="78" fill="#7c3aed" opacity="0.15" filter="url(#wide)" clip-path="url(#frame)"/>
  <ellipse cx="90" cy="88"  rx="58" ry="52" fill="#9333ea" opacity="0.20" filter="url(#mid)"  clip-path="url(#frame)"/>

  <!-- Wide bloom layer -->
  <g filter="url(#wide)" clip-path="url(#frame)" opacity="0.75">
    <path d="M 34,108 A 56,56 0 0,1 146,108"
          stroke="#8b21e8" stroke-width="32" stroke-linecap="round" fill="none"/>
    <rect x="5"   y="94" width="58" height="66" rx="20" fill="#7c3aed"/>
    <rect x="117" y="94" width="58" height="66" rx="20" fill="#7c3aed"/>
  </g>

  <!-- Left ear cup -->
  <rect x="5" y="94" width="58" height="66" rx="20"
        fill="url(#lc)" stroke="#c090f8" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Left inner oval -->
  <ellipse cx="34" cy="128" rx="18" ry="22"
           fill="url(#ov)" stroke="#9d64f0" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Right ear cup -->
  <rect x="117" y="94" width="58" height="66" rx="20"
        fill="url(#rc)" stroke="#c090f8" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Right inner oval -->
  <ellipse cx="146" cy="128" rx="18" ry="22"
           fill="url(#ov)" stroke="#9d64f0" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Headband halo -->
  <path d="M 34,108 A 56,56 0 0,1 146,108"
        stroke="#a855f7" stroke-width="28" stroke-linecap="round" fill="none"
        filter="url(#mid)" opacity="0.55" clip-path="url(#frame)"/>

  <!-- Headband main tube -->
  <path d="M 34,108 A 56,56 0 0,1 146,108"
        stroke="url(#hb)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <!-- Convex highlight stripe -->
  <path d="M 34,108 A 56,56 0 0,1 146,108"
        stroke="#efc8ff" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.30"/>

  <!-- Crystal cap at top of arc -->
  <ellipse cx="90" cy="53" rx="26" ry="18" fill="#d4a8ff" filter="url(#shine)" opacity="0.75"/>
  <ellipse cx="90" cy="52" rx="13" ry="9"  fill="url(#cap)"/>
  <ellipse cx="90" cy="51" rx="5.5" ry="4" fill="white" opacity="0.98"/>
</svg>
