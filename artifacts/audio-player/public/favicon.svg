<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background radial gradient: deep navy -->
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a0f3a"/>
      <stop offset="100%" stop-color="#07091a"/>
    </radialGradient>
    <!-- Crystal body gradient: light violet top-left → deep purple bottom-right -->
    <linearGradient id="gem" x1="25%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%"   stop-color="#e0aaff"/>
      <stop offset="30%"  stop-color="#c026d3"/>
      <stop offset="70%"  stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <!-- Rim glow gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f0abfc"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Specular highlight -->
    <radialGradient id="spec" cx="35%" cy="28%" r="38%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient glow blur -->
    <filter id="amb" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <!-- Rim blur -->
    <filter id="rimBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect width="180" height="180" rx="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>

  <!-- Ambient purple bloom -->
  <ellipse cx="96" cy="92" rx="72" ry="64" fill="#9333ea" opacity="0.35" filter="url(#amb)" clip-path="url(#frame)"/>

  <!-- Glow halo (blurred triangle, slightly larger) -->
  <polygon points="38,36 38,144 148,90" fill="#c084fc" opacity="0.45" filter="url(#amb)" clip-path="url(#frame)"/>

  <!-- Rim stroke (blurred) -->
  <polygon points="38,36 38,144 148,90" fill="none" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round" filter="url(#rimBlur)"/>

  <!-- Crystal body -->
  <polygon points="38,36 38,144 148,90" fill="url(#gem)" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Specular highlight overlay -->
  <polygon points="38,36 38,144 148,90" fill="url(#spec)"/>

  <!-- Lens flare star at top corner -->
  <circle cx="68" cy="50" r="2.5" fill="white" opacity="0.95"/>
  <line x1="68" y1="42" x2="68" y2="58" stroke="white" stroke-width="1" opacity="0.55"/>
  <line x1="60" y1="50" x2="76" y2="50" stroke="white" stroke-width="1" opacity="0.55"/>
</svg>
