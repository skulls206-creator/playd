<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#180d38"/>
      <stop offset="100%" stop-color="#07091a"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e0aaff"/>
      <stop offset="35%"  stop-color="#c026d3"/>
      <stop offset="70%"  stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#e0aaff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="capglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame">
      <rect width="180" height="180" rx="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>

  <!-- Ambient bloom (blurred bars) -->
  <!-- Left bar bloom -->
  <rect x="42" y="72" width="28" height="90" rx="14" fill="#a855f7" opacity="0.5" filter="url(#glow)" clip-path="url(#frame)"/>
  <!-- Center bar bloom -->
  <rect x="76" y="28" width="28" height="134" rx="14" fill="#a855f7" opacity="0.5" filter="url(#glow)" clip-path="url(#frame)"/>
  <!-- Right bar bloom -->
  <rect x="110" y="94" width="28" height="68" rx="14" fill="#a855f7" opacity="0.5" filter="url(#glow)" clip-path="url(#frame)"/>

  <!-- Left bar body -->
  <rect x="44" y="74" width="24" height="86" rx="12" fill="url(#bar)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Left bar cap glow -->
  <ellipse cx="56" cy="76" rx="10" ry="7" fill="url(#cap)" filter="url(#capglow)"/>

  <!-- Center bar body (tallest) -->
  <rect x="78" y="30" width="24" height="130" rx="12" fill="url(#bar)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Center bar cap glow -->
  <ellipse cx="90" cy="32" rx="10" ry="7" fill="url(#cap)" filter="url(#capglow)"/>

  <!-- Right bar body (shortest) -->
  <rect x="112" y="96" width="24" height="64" rx="12" fill="url(#bar)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Right bar cap glow -->
  <ellipse cx="124" cy="98" rx="10" ry="7" fill="url(#cap)" filter="url(#capglow)"/>

  <!-- Bottom base glow line -->
  <rect x="36" y="156" width="108" height="3" rx="2" fill="#c084fc" opacity="0.4" filter="url(#capglow)"/>
</svg>
