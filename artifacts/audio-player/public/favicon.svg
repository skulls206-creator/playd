<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%"   stop-color="#180d38"/>
      <stop offset="100%" stop-color="#07091a"/>
    </radialGradient>
    <linearGradient id="hb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0d0ff"/>
      <stop offset="28%"  stop-color="#d946ef"/>
      <stop offset="62%"  stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lc" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#e0aaff"/>
      <stop offset="42%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="rc" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%"   stop-color="#e0aaff"/>
      <stop offset="42%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="20%" r="70%">
      <stop offset="0%"   stop-color="white"   stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#e0aaff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="shine" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect width="180" height="180" rx="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>

  <!-- Bloom layer -->
  <g filter="url(#bloom)" clip-path="url(#frame)" opacity="0.7">
    <path d="M 34,110 A 56,56 0 0,1 146,110"
          stroke="#9d4fef" stroke-width="28" stroke-linecap="round" fill="none"/>
    <rect x="12" y="100" width="44" height="58" rx="14" fill="#8b21e8"/>
    <rect x="124" y="100" width="44" height="58" rx="14" fill="#8b21e8"/>
  </g>

  <!-- Left ear cup -->
  <rect x="12" y="100" width="44" height="58" rx="14"
        fill="url(#lc)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/>
  <ellipse cx="34" cy="130" rx="12" ry="16"
           fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-opacity="0.4"/>
  <ellipse cx="34" cy="130" rx="5" ry="6" fill="#c084fc" opacity="0.22"/>

  <!-- Right ear cup -->
  <rect x="124" y="100" width="44" height="58" rx="14"
        fill="url(#rc)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/>
  <ellipse cx="146" cy="130" rx="12" ry="16"
           fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-opacity="0.4"/>
  <ellipse cx="146" cy="130" rx="5" ry="6" fill="#c084fc" opacity="0.22"/>

  <!-- Headband -->
  <path d="M 34,110 A 56,56 0 0,1 146,110"
        stroke="url(#hb)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 34,110 A 56,56 0 0,1 146,110"
        stroke="#c084fc" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.32"/>

  <!-- Crystal cap highlight at arc top -->
  <ellipse cx="90" cy="55" rx="18" ry="11" fill="url(#cap)" filter="url(#shine)"/>
  <ellipse cx="90" cy="54" rx="8"  ry="5"  fill="white" opacity="0.78"/>
</svg>
