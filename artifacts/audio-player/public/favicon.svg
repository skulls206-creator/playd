<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="70%">
      <stop offset="0%"   stop-color="#160936"/>
      <stop offset="100%" stop-color="#060010"/>
    </radialGradient>
    <linearGradient id="hb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ddb0ff"/>
      <stop offset="20%"  stop-color="#c026d3"/>
      <stop offset="60%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="lc" cx="35%" cy="28%" r="76%">
      <stop offset="0%"   stop-color="#cc88ff"/>
      <stop offset="42%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4a18a0"/>
    </radialGradient>
    <radialGradient id="rc" cx="65%" cy="28%" r="76%">
      <stop offset="0%"   stop-color="#cc88ff"/>
      <stop offset="42%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4a18a0"/>
    </radialGradient>
    <radialGradient id="cap" cx="50%" cy="20%" r="75%">
      <stop offset="0%"   stop-color="white"   stop-opacity="1"/>
      <stop offset="38%"  stop-color="#f0d4ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="halo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shine" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect width="180" height="180" rx="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>

  <!-- Bloom silhouette -->
  <g filter="url(#bloom)" clip-path="url(#frame)" opacity="0.72">
    <path d="M 36,106 A 54,54 0 0,1 144,106"
          stroke="#9333ea" stroke-width="28" stroke-linecap="round" fill="none"/>
    <ellipse cx="36"  cy="130" rx="30" ry="34" fill="#8b3af7"/>
    <ellipse cx="144" cy="130" rx="30" ry="34" fill="#8b3af7"/>
  </g>

  <!-- Left ear cup -->
  <ellipse cx="36" cy="130" rx="28" ry="32"
           fill="url(#lc)" stroke="#b87ef5" stroke-width="2.5" stroke-opacity="0.55"/>
  <ellipse cx="36" cy="130" rx="18" ry="21"
           fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Right ear cup -->
  <ellipse cx="144" cy="130" rx="28" ry="32"
           fill="url(#rc)" stroke="#b87ef5" stroke-width="2.5" stroke-opacity="0.55"/>
  <ellipse cx="144" cy="130" rx="18" ry="21"
           fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Headband halo -->
  <path d="M 36,106 A 54,54 0 0,1 144,106"
        stroke="#a855f7" stroke-width="22" stroke-linecap="round" fill="none"
        filter="url(#halo)" opacity="0.5" clip-path="url(#frame)"/>

  <!-- Headband main -->
  <path d="M 36,106 A 54,54 0 0,1 144,106"
        stroke="url(#hb)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Tube sheen -->
  <path d="M 36,106 A 54,54 0 0,1 144,106"
        stroke="#e8c8ff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.26"/>

  <!-- Crystal cap -->
  <ellipse cx="90" cy="53" rx="24" ry="16" fill="#c084fc" filter="url(#shine)" opacity="0.85"/>
  <ellipse cx="90" cy="52" rx="12" ry="8"  fill="url(#cap)"/>
  <ellipse cx="90" cy="51" rx="5"  ry="3.5" fill="white" opacity="0.96"/>
</svg>
