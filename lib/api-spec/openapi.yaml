openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Audio Player API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tracks
    description: Track library management
  - name: playlists
    description: Playlist management
  - name: queue
    description: Play queue management
  - name: eq-presets
    description: Equalizer preset management
  - name: subsonic
    description: Subsonic server management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tracks:
    get:
      operationId: listTracks
      tags: [tracks]
      summary: List all tracks
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: artist
          in: query
          schema:
            type: string
        - name: album
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
    post:
      operationId: createTrack
      tags: [tracks]
      summary: Create a track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrackBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"

  /tracks/bulk:
    post:
      operationId: bulkUpsertTracks
      tags: [tracks]
      summary: Bulk upsert tracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpsertTracksBody"
      responses:
        "200":
          description: Upserted tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpsertTracksResponse"

  /tracks/{id}/replaygain:
    patch:
      operationId: setTrackReplaygain
      tags: [tracks]
      summary: Set the ReplayGain value for a track
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTrackReplaygainBody"
      responses:
        "200":
          description: Updated track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tracks/{id}:
    get:
      operationId: getTrack
      tags: [tracks]
      summary: Get a track
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTrack
      tags: [tracks]
      summary: Update a track (tag edit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackBody"
      responses:
        "200":
          description: Updated track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrack
      tags: [tracks]
      summary: Delete a track
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: List all playlists
      responses:
        "200":
          description: Playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /playlists/{id}/tracks:
    get:
      operationId: getPlaylistTracks
      tags: [playlists]
      summary: Get tracks for a playlist (evaluates smart playlist query if present)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addTrackToPlaylist
      tags: [playlists]
      summary: Add a track to a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTrackToPlaylistBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistTrack"

  /playlists/{id}/tracks/{trackId}:
    delete:
      operationId: removeTrackFromPlaylist
      tags: [playlists]
      summary: Remove a track from a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: trackId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /queue:
    get:
      operationId: getQueue
      tags: [queue]
      summary: Get current play queue
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
    put:
      operationId: replaceQueue
      tags: [queue]
      summary: Replace entire queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceQueueBody"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
    post:
      operationId: addToQueue
      tags: [queue]
      summary: Add track(s) to queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToQueueBody"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
    delete:
      operationId: clearQueue
      tags: [queue]
      summary: Clear the queue
      responses:
        "204":
          description: Cleared

  /queue/{id}:
    delete:
      operationId: removeFromQueue
      tags: [queue]
      summary: Remove a queue item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /eq-presets:
    get:
      operationId: listEqPresets
      tags: [eq-presets]
      summary: List EQ presets
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EqPreset"
    post:
      operationId: createEqPreset
      tags: [eq-presets]
      summary: Create an EQ preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEqPresetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EqPreset"

  /eq-presets/active:
    put:
      operationId: setActiveEqPreset
      tags: [eq-presets]
      summary: Set the active EQ preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveEqPresetBody"
      responses:
        "200":
          description: Updated preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EqPreset"

  /eq-presets/{id}:
    patch:
      operationId: updateEqPreset
      tags: [eq-presets]
      summary: Update an EQ preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEqPresetBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EqPreset"
    delete:
      operationId: deleteEqPreset
      tags: [eq-presets]
      summary: Delete an EQ preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subsonic-servers:
    get:
      operationId: listSubsonicServers
      tags: [subsonic]
      summary: List Subsonic servers
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubsonicServer"
    post:
      operationId: createSubsonicServer
      tags: [subsonic]
      summary: Add a Subsonic server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubsonicServerBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsonicServer"

  /subsonic-servers/{id}:
    patch:
      operationId: updateSubsonicServer
      tags: [subsonic]
      summary: Update a Subsonic server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubsonicServerBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsonicServer"
    delete:
      operationId: deleteSubsonicServer
      tags: [subsonic]
      summary: Delete a Subsonic server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subsonic-servers/{id}/test:
    get:
      operationId: testSubsonicServer
      tags: [subsonic]
      summary: Test Subsonic server connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsonicTestResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Track:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        year:
          type: ["integer", "null"]
        genre:
          type: ["string", "null"]
        duration:
          type: number
        trackNumber:
          type: ["integer", "null"]
        fileName:
          type: string
        folderPath:
          type: string
        albumArtDataUrl:
          type: ["string", "null"]
        rating:
          type: integer
        source:
          type: string
        subsonicId:
          type: ["string", "null"]
        subsonicServerId:
          type: ["integer", "null"]
        replaygainGain:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - artist
        - album
        - duration
        - fileName
        - folderPath
        - rating
        - source
        - createdAt
        - updatedAt

    CreateTrackBody:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        year:
          type: ["integer", "null"]
        genre:
          type: ["string", "null"]
        duration:
          type: number
        trackNumber:
          type: ["integer", "null"]
        fileName:
          type: string
        folderPath:
          type: string
        albumArtDataUrl:
          type: ["string", "null"]
        rating:
          type: integer
        source:
          type: string
        subsonicId:
          type: ["string", "null"]
        subsonicServerId:
          type: ["integer", "null"]
      required:
        - title
        - fileName

    SetTrackReplaygainBody:
      type: object
      properties:
        gain:
          type: number
      required:
        - gain

    UpdateTrackBody:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        year:
          type: ["integer", "null"]
        genre:
          type: ["string", "null"]
        trackNumber:
          type: ["integer", "null"]
        rating:
          type: integer
        albumArtDataUrl:
          type: ["string", "null"]
        replaygainGain:
          type: ["number", "null"]

    BulkUpsertTracksBody:
      type: object
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/CreateTrackBody"
      required:
        - tracks

    BulkUpsertTracksResponse:
      type: object
      properties:
        upserted:
          type: integer
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
      required:
        - upserted
        - tracks

    Playlist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        query:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    CreatePlaylistBody:
      type: object
      properties:
        name:
          type: string
        query:
          type: ["string", "null"]
      required:
        - name

    UpdatePlaylistBody:
      type: object
      properties:
        name:
          type: string
        query:
          type: ["string", "null"]

    PlaylistTrack:
      type: object
      properties:
        id:
          type: integer
        playlistId:
          type: integer
        trackId:
          type: integer
        position:
          type: integer
      required:
        - id
        - playlistId
        - trackId
        - position

    AddTrackToPlaylistBody:
      type: object
      properties:
        trackId:
          type: integer
        position:
          type: integer
      required:
        - trackId

    QueueItem:
      type: object
      properties:
        id:
          type: integer
        trackId:
          type: integer
        position:
          type: integer
        track:
          $ref: "#/components/schemas/Track"
      required:
        - id
        - trackId
        - position
        - track

    ReplaceQueueBody:
      type: object
      properties:
        trackIds:
          type: array
          items:
            type: integer
      required:
        - trackIds

    AddToQueueBody:
      type: object
      properties:
        trackIds:
          type: array
          items:
            type: integer
      required:
        - trackIds

    EqPreset:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bands:
          type: string
        isActive:
          type: boolean
        isBuiltin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - bands
        - isActive
        - isBuiltin
        - createdAt
        - updatedAt

    CreateEqPresetBody:
      type: object
      properties:
        name:
          type: string
        bands:
          type: string
        isActive:
          type: boolean
      required:
        - name
        - bands

    UpdateEqPresetBody:
      type: object
      properties:
        name:
          type: string
        bands:
          type: string

    SetActiveEqPresetBody:
      type: object
      properties:
        presetId:
          type: ["integer", "null"]
      required:
        - presetId

    SubsonicServer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        username:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - url
        - username
        - isActive
        - createdAt
        - updatedAt

    CreateSubsonicServerBody:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        username:
          type: string
        password:
          type: string
        isActive:
          type: boolean
      required:
        - name
        - url
        - username
        - password

    UpdateSubsonicServerBody:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        username:
          type: string
        password:
          type: string
        isActive:
          type: boolean

    SubsonicTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        version:
          type: ["string", "null"]
      required:
        - success
        - message
